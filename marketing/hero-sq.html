<!doctype html><html><head><meta charset="utf-8"><link href="fonts-local.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#16243e;font-family:"Work Sans",Arial,sans-serif}
.bebas{font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;font-weight:400}
.photo{position:absolute;top:0;left:0;width:1080px;height:790px;overflow:hidden;background:#7fa7c9}
.photo .bg{position:absolute;inset:-40px;width:1160px;height:870px;object-fit:cover;filter:blur(28px) brightness(.85)}
.photo .fg{position:absolute;top:0;left:0;width:1080px;height:790px;object-fit:contain}
.band{position:absolute;top:790px;left:0;width:1080px;height:290px;background:#16243e;border-top:12px solid #E56117;padding:22px 64px 0;color:#fff;display:flex;align-items:center;justify-content:space-between}
.band .logo{width:380px;height:auto;display:block}
.band .right{text-align:right}
.rent{font-size:112px;line-height:.9;color:#E56117;letter-spacing:.02em}
.mach{margin-top:8px;font-size:27px;line-height:1;color:#fff;letter-spacing:.04em}
.loc{margin-top:8px;font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#c9d1dd}
.loc span{color:#E56117;padding:0 10px}
</style></head><body>
<div class="photo"><img class="bg" src="hero-photo-sq.jpg"><img class="fg" src="hero-photo-sq.jpg"></div>
<div class="band">
  <img class="logo" src="nashco-logo-dark.png" alt="Nashco Rentals">
  <div class="right">
    <div class="rent bebas">FOR RENT</div>
    <div class="mach bebas">TAKEUCHI TL11R3 TRACK LOADER</div>
    <div class="loc">Leona, TX<span>•</span>Free delivery within 25 mi</div>
  </div>
</div>
</body></html>
