<!doctype html><html><head><meta charset="utf-8"><link href="fonts-local.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#0B2340;font-family:"Work Sans",Arial,sans-serif}
.bebas{font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;font-weight:400}
.photo{position:absolute;top:0;left:0;width:1080px;height:800px;overflow:hidden;background:#9a9a9a}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.band{position:absolute;top:800px;left:0;width:1080px;height:550px;background:#16243e;border-top:12px solid #E56117;padding:44px 72px 0;color:#fff}
.band .logo{display:block;width:520px;height:auto;margin:0 auto}
.rent{margin-top:26px;text-align:center;font-size:150px;line-height:.95;color:#E56117;letter-spacing:.02em}
.mach{margin-top:8px;text-align:center;font-size:46px;line-height:1;color:#fff;letter-spacing:.02em}
.loc{margin-top:16px;text-align:center;font-size:24px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#c9d1dd}
.loc span{color:#E56117;padding:0 14px}
</style></head><body>
<div class="photo"><img src="hero-photo.jpg"></div>
<div class="band">
  <img class="logo" src="nashco-logo-dark.png" alt="Nashco Rentals">
  <div class="rent bebas">FOR RENT</div>
  <div class="mach bebas">TAKEUCHI TL11R3 TRACK LOADER</div>
  <div class="loc">Leona, Texas<span>•</span>Free delivery within 25 miles</div>
</div>
</body></html>
